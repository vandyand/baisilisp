name: Run clojure-test-suite

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
  schedule:
    - cron: "43 16 * * 0"

jobs:
  run-clojure-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: basilisp
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          path: clojure-test-suite
          repository: basilisp-lang/clojure-test-suite
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Install pip and dependencies
        run: |
          cd clojure-test-suite
          pip install -U pip
          python -m venv .venv
          source .venv/bin/activate
          pip install "baisilisp[pytest] @ file://$(realpath ../basilisp)"
      - name: Run tests
        run: |
          cd clojure-test-suite
          source .venv/bin/activate
          BASILISP_COMMAND="$(pwd)/.venv/bin/basilisp run"
          IGNORE_ARGS="$(python ../basilisp/scripts/clojure_test_suite_residuals.py \
            --suite-root . \
            --repo-root ../basilisp \
            --verify-evidence \
            --disable-basilisp-ns-cache \
            --basilisp-command "$BASILISP_COMMAND" \
            --pytest-ignore-args)"
          BASILISP_TEST_PATH="$(pwd)/test" \
            BASILISP_TEST_FILE_PATTERN='.*\.(lpy|cljc)' \
            basilisp test -p test -- --continue-on-collection-errors $IGNORE_ARGS
